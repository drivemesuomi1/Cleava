        const t = T[LANG];

        // Apply translations to static HTML
        function applyTranslations() {
            document.title = t.pageTitle;
            // Back link
            document.querySelector('a[href="https://cleava.fi"]').lastChild.textContent = ' ' + t.backToHome;
            // Sidebar
            document.querySelector('.serif.text-2xl.md\\:text-3xl').textContent = t.bookYourTime;
            const stepLabels = [t.stepService, t.stepType, t.stepLocation, t.stepContact, t.stepDates];
            document.querySelectorAll('[id^="step-nav-"] span').forEach((el, i) => { el.textContent = stepLabels[i]; });
            // Step 1
            document.querySelector('#step1 h2').textContent = t.chooseService;
            document.querySelector('#step1 p').textContent = t.whatCleaning;
            const s1cards = document.querySelectorAll('#step1 .option-card');
            s1cards[0].querySelector('h3').textContent = t.homeCleaning;
            s1cards[0].querySelector('p').textContent = t.homeCleaningDesc;
            s1cards[1].querySelector('h3').textContent = t.businessCleaning;
            s1cards[1].querySelector('p').textContent = t.businessCleaningDesc;
            document.getElementById('btnNext1').textContent = t.next;
            // Step 2
            document.querySelector('#step2 h2').textContent = t.frequency;
            document.querySelector('#step2 > p').textContent = t.frequencyDesc;
            const s2cards = document.querySelectorAll('#step2 .option-card');
            s2cards[0].querySelector('h3').textContent = t.oneTime;
            s2cards[0].querySelector('p').textContent = t.oneTimeDesc;
            s2cards[1].querySelector('h3').textContent = t.recurring;
            s2cards[1].querySelector('p').textContent = t.recurringDesc;
            document.querySelector('#step2 .text-gray-400').textContent = t.back;
            document.getElementById('btnNext2').textContent = t.next;
            // Step 3
            document.querySelector('#step3 h2').textContent = t.location;
            document.querySelector('#step3 > p').textContent = t.locationDesc;
            const s3inputs = document.querySelectorAll('#step3 input');
            s3inputs[0].placeholder = t.address;
            s3inputs[1].placeholder = t.zip;
            s3inputs[2].placeholder = t.city;
            s3inputs[3].placeholder = t.area;
            document.querySelector('#step3 .text-gray-400').textContent = t.back;
            document.querySelector('#step3 .btn-primary').textContent = t.next;
            // Step 4
            document.querySelector('#step4 h2').textContent = t.contactInfo;
            document.querySelector('#step4 > p').textContent = t.contactDesc;
            const s4inputs = document.querySelectorAll('#step4 input[type="text"], #step4 input[type="email"], #step4 input[type="tel"]');
            s4inputs[0].placeholder = t.fullName;
            s4inputs[1].placeholder = t.email;
            s4inputs[2].placeholder = t.phone;
            document.querySelector('label[for="tax_credit"] span').textContent = t.taxCredit;
            document.querySelector('label[for="tax_credit"]').lastChild.textContent = '\n                                ' + t.taxCreditDesc;
            document.querySelector('label[for="privacy_policy"] span').innerHTML = t.privacyAccept + ' <a href="/varaa/tietosuojaseloste?from=form" target="_blank" style="color: #62cdd4;" class="underline hover:opacity-70">' + t.privacyLink + '</a>';
            document.querySelector('#step4 .text-gray-400').textContent = t.back;
            document.querySelector('#step4 .btn-primary').textContent = t.next;
            // Step 5
            document.querySelector('#step5 h2').textContent = t.chooseDates;
            document.querySelector('#step5 > p').textContent = t.chooseDatesDesc;
            document.querySelector('#step5 label').textContent = t.notes;
            document.querySelector('#step5 textarea').placeholder = t.notesPlaceholder;
            document.querySelector('#step5 .bg-blue-50 p').innerHTML = '⏱️ ' + t.responseTime;
            document.querySelector('#step5 .text-gray-400').textContent = t.back;
            document.getElementById('btnFinal').textContent = t.submit;
            // Day headers
            document.querySelectorAll('.calendar-grid .text-\\[10px\\]').forEach((el, i) => { el.textContent = t.days[i]; });
            // Footer
            var sslText = document.querySelector('.text-gray-400.text-sm');
            if(sslText) {
                sslText.querySelector('.flex.items-center.gap-1').innerHTML = '<svg width="16" height="16" fill="green" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"></path></svg> ' + t.sslSecure;
                sslText.querySelector('.flex.items-center.gap-4 span:last-child').textContent = t.trustedDomestic;
            }
        }

        let currentStep = 1;
        let activeMonth = new Date();
        let selectedDates = [];

        const months = t.months;

        function goToStep(step) {
            document.querySelectorAll('[id^="step-nav-"]').forEach((el, idx) => {
                if(idx + 1 === step) el.style.opacity = "1";
                else if(idx + 1 < step) el.style.opacity = "1";
                else el.style.opacity = "0.4";
            });
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            currentStep = step;
            if(step === 5) renderCalendar();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function selectOption(cat, val, el) {
            const container = el.parentElement;
            container.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('hidden_' + cat).value = val;
            if(cat === 'service') document.getElementById('btnNext1').disabled = false;
            if(cat === 'frequency') document.getElementById('btnNext2').disabled = false;
        }

        function validateStep3() {
            const s3 = document.getElementById('step3');
            let ok = true;
            s3.querySelectorAll('input').forEach(i => {
                if(!i.value) { i.style.borderColor = "red"; ok = false; }
                else i.style.borderColor = "#edf2f7";
            });
            return ok;
        }

        function validateStep4() {
            const s4 = document.getElementById('step4');
            let ok = true;
            // Validate text inputs (name, email, phone)
            s4.querySelectorAll('input[type="text"], input[type="email"], input[type="tel"]').forEach(i => {
                if(!i.value) { i.style.borderColor = "red"; ok = false; }
                else i.style.borderColor = "#edf2f7";
            });
            // Validate privacy policy checkbox
            const pp = document.getElementById('privacy_policy');
            if(!pp.checked) {
                pp.parentElement.parentElement.style.borderColor = "red";
                ok = false;
            } else {
                pp.parentElement.parentElement.style.borderColor = "";
            }
            return ok;
        }

        // --- Multi-date calendar ---
        function isDateSelected(d) {
            return selectedDates.some(sd => sd.getTime() === d.getTime());
        }

        function toggleDate(dObj) {
            const idx = selectedDates.findIndex(sd => sd.getTime() === dObj.getTime());
            if(idx > -1) {
                selectedDates.splice(idx, 1);
            } else {
                if(selectedDates.length >= 3) return; // max 3
                selectedDates.push(dObj);
            }
            selectedDates.sort((a,b) => a - b);
            updateDateHiddens();
            updateSelectedDisplay();
            renderCalendar();
            renderTimeSelectors();
        }

        function updateDateHiddens() {
            for(let i = 1; i <= 3; i++) {
                const el = document.getElementById('hidden_date' + i);
                el.value = selectedDates[i-1] ? selectedDates[i-1].toLocaleDateString('fi-FI') : '';
            }
            document.getElementById('btnFinal').disabled = selectedDates.length < 1 || !allTimesSelected();
        }

        function allTimesSelected() {
            for(let i = 1; i <= selectedDates.length; i++) {
                if(!document.getElementById('hidden_time' + i).value) return false;
            }
            return true;
        }

        const timeSlots = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];

        function renderTimeSelectors() {
            const container = document.getElementById('timeSelectorsContainer');
            container.innerHTML = '';
            selectedDates.forEach((d, i) => {
                const idx = i + 1;
                const currentTime = document.getElementById('hidden_time' + idx).value;
                const wrapper = document.createElement('div');
                wrapper.className = 'bg-[#f1f5f9] rounded-xl p-4';
                const label = document.createElement('label');
                label.className = 'block text-sm font-semibold text-gray-700 mb-2';
                label.textContent = `${idx}. ${t.preference}: ${d.toLocaleDateString(LANG === 'en' ? 'en-GB' : 'fi-FI')} — ${t.clockTime}`;
                wrapper.appendChild(label);
                const select = document.createElement('select');
                select.className = 'input-field py-3 px-4';
                const defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.textContent = t.selectTime;
                defaultOpt.disabled = true;
                defaultOpt.selected = !currentTime;
                select.appendChild(defaultOpt);
                timeSlots.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    if(currentTime === t) opt.selected = true;
                    select.appendChild(opt);
                });
                select.onchange = () => {
                    document.getElementById('hidden_time' + idx).value = select.value;
                    document.getElementById('btnFinal').disabled = selectedDates.length < 1 || !allTimesSelected();
                };
                wrapper.appendChild(select);
                container.appendChild(wrapper);
            });
        }

        function updateSelectedDisplay() {
            const container = document.getElementById('selectedDatesDisplay');
            container.innerHTML = '';
            if(selectedDates.length === 0) {
                container.innerHTML = '<span class="text-sm text-gray-400">' + t.noDatesSelected + '</span>';
                return;
            }
            selectedDates.forEach((d, i) => {
                const tag = document.createElement('div');
                tag.className = 'flex items-center gap-2 bg-[#002350] text-white text-sm font-semibold px-4 py-2 rounded-full';
                tag.innerHTML = `<span>${i+1}. ${t.preference}: ${d.toLocaleDateString(LANG === 'en' ? 'en-GB' : 'fi-FI')}</span><button type="button" onclick="removeDate(${i})" class="ml-1 hover:opacity-70">&times;</button>`;
                container.appendChild(tag);
            });
            if(selectedDates.length < 3) {
                const hint = document.createElement('span');
                hint.className = 'text-sm text-gray-400 self-center';
                hint.textContent = `${t.selectMore} ${3 - selectedDates.length}`;
                container.appendChild(hint);
            }
        }

        function removeDate(idx) {
            selectedDates.splice(idx, 1);
            // Clear all time hidden fields and re-assign
            for(let i = 1; i <= 3; i++) {
                document.getElementById('hidden_time' + i).value = '';
            }
            updateDateHiddens();
            updateSelectedDisplay();
            renderCalendar();
            renderTimeSelectors();
        }

        function renderCalendar() {
            const grid = document.getElementById('calDays');
            const label = document.getElementById('calLabel');
            grid.innerHTML = '';
            const yr = activeMonth.getFullYear();
            const mo = activeMonth.getMonth();
            label.textContent = months[mo] + " " + yr;
            const days = new Date(yr, mo + 1, 0).getDate();
            let start = new Date(yr, mo, 1).getDay();
            start = (start === 0) ? 6 : start - 1;
            for(let i=0; i<start; i++) grid.appendChild(document.createElement('div'));
            const now = new Date(); now.setHours(0,0,0,0);

            for(let d=1; d<=days; d++) {
                const day = document.createElement('div');
                const dObj = new Date(yr, mo, d);
                day.className = 'calendar-day';
                day.textContent = d;
                if(dObj < now) { day.classList.add('disabled'); }
                else {
                    if(isDateSelected(dObj)) day.classList.add('selected');
                    day.onclick = () => toggleDate(dObj);
                }
                grid.appendChild(day);
            }
            updateSelectedDisplay();
        }

        function changeMonth(d) {
            activeMonth.setMonth(activeMonth.getMonth() + d);
            renderCalendar();
        }

        // --- Form Submission via Netlify Function ---
        function submitBooking() {
            const form = document.getElementById('bookingForm');
            const btn = document.getElementById('btnFinal');
            btn.innerHTML = '<span class="animate-pulse">' + t.submitting + '</span>';
            btn.disabled = true;

            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            fetch('/.netlify/functions/submit-booking', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => {
                if (!res.ok) throw new Error('Server responded with ' + res.status);
                return res.json();
            })
            .then(result => {
                if (result.success) {
                    window.top.location.href = "/varaa/kiitos" + (LANG === 'en' ? '?lang=en' : '');
                } else {
                    throw new Error(result.error || 'Booking failed');
                }
            })
            .catch(err => {
                console.error('Submit error:', err);
                btn.innerHTML = t.submit || 'Lähetä varaus';
                btn.disabled = false;
                alert(LANG === 'en' ? 'Something went wrong. Please try again or contact us directly.' : 'Jokin meni pieleen. Yritä uudelleen tai ota meihin suoraan yhteyttä.');
            });
        }

        // Apply translations on load
        applyTranslations();
    </script>


<script>
// === FORM WIRING — attaches handlers via addEventListener ===
(function() {
  function wire(form, handler) {
    if (!form || form.dataset.wired) return;
    form.dataset.wired = '1';
    form.addEventListener('submit', handler, false);
  }
  function attach() {
    var hero = document.querySelector('form[name="hero-lead"]');
    var modal = document.querySelector('form[name="contact-quick"]');
    var ctas = document.querySelectorAll('form[name="footer-cta"]');
    var booking = document.querySelector('form[name="booking"]');
    if (hero && typeof submitForm === 'function') {
      wire(hero, function(e) { return submitForm(e, 'hero'); });
    }
    if (modal && typeof submitForm === 'function') {
      wire(modal, function(e) { return submitForm(e, 'modal'); });
    }
    ctas.forEach(function(form) {
      if (typeof submitCtaForm === 'function') {
        wire(form, function(e) { return submitCtaForm(e, 'footer-cta'); });
      }
    });
    if (booking && typeof submitBookingForm === 'function') {
      wire(booking, function(e) { return submitBookingForm(e); });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach);
  } else {
    attach();
  }
  window.addEventListener('load', attach);
})();
</script>
