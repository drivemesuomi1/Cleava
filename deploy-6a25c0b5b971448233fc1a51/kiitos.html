<script>
// === FORM WIRING — attaches handlers via addEventListener ===
(function() {
  function wire(form, handler) {
    if (!form || form.dataset.wired) return;
    form.dataset.wired = '1';
    form.addEventListener('submit', handler, false);
  }
  function attach() {
    var hero = document.querySelector('form[name="hero-lead"]');
    var modal = document.querySelector('form[name="contact-quick"]');
    var ctas = document.querySelectorAll('form[name="footer-cta"]');
    var booking = document.querySelector('form[name="booking"]');
    if (hero && typeof submitForm === 'function') {
      wire(hero, function(e) { return submitForm(e, 'hero'); });
    }
    if (modal && typeof submitForm === 'function') {
      wire(modal, function(e) { return submitForm(e, 'modal'); });
    }
    ctas.forEach(function(form) {
      if (typeof submitCtaForm === 'function') {
        wire(form, function(e) { return submitCtaForm(e, 'footer-cta'); });
      }
    });
    if (booking && typeof submitBookingForm === 'function') {
      wire(booking, function(e) { return submitBookingForm(e); });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach);
  } else {
    attach();
  }
  window.addEventListener('load', attach);
})();
</script>
